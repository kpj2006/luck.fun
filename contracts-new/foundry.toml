[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

# Solidity compiler settings
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false

# Formatting
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

# Testing
verbosity = 3
fuzz_runs = 256
fuzz_max_test_rejects = 65536
invariant_runs = 256
invariant_depth = 15

# Gas reporting
gas_reports = ["*"]
gas_reports_ignore = []

# Coverage
coverage = true

# Compilation
auto_detect_solc = false
offline = false
use_literal_content = false
bytecode_hash = "none"
sparse_mode = false
build_info = true
extra_output = ["storageLayout"]

# File system permissions
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# RPC endpoints
[rpc_endpoints]
monad_testnet = "https://testnet.monad.xyz"
monad_mainnet = "https://mainnet.monad.xyz"
localhost = "http://localhost:8545"

# Etherscan API keys (for verification)
[etherscan]
monad_testnet = { key = "${MONAD_API_KEY}", url = "https://testnet-explorer.monad.xyz/api" }
monad_mainnet = { key = "${MONAD_API_KEY}", url = "https://explorer.monad.xyz/api" }

# CI profile (stricter settings)
[profile.ci]
fuzz_runs = 10000
invariant_runs = 1000
invariant_depth = 500
verbosity = 4

# Deployment profile (optimized)
[profile.deploy]
optimizer = true
optimizer_runs = 1000000
via_ir = true

# Testing profile (faster compilation)
[profile.test]
optimizer = false
verbosity = 3
